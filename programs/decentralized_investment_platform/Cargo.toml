[package]
name = "decentralized_investment_platform"
version = "0.1.0"
description = "A decentralized investment platform for local businesses on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "decentralized_investment_platform"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = [
    "token_2022",
    "token_2022_extensions",
    "spl-token-interface",
    "associated_token",
] }